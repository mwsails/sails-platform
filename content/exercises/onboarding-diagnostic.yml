# The first exercise every org completes. Seeds `company.*`/`team.*`, which
# doubles as the routing-signal set the plan (§2) calls for capturing at
# diagnostic time. Track *recommendation* itself lives in app code
# (src/lib/tracks/recommend.ts), not this file — it's a deterministic score
# across several fields, not a single-field mapping the writes/steps model
# is built to express. That function reads these same context fields after
# this exercise's writes land, and writes company.recommended_tier +
# team.has_sales_manager-derived tags back separately.
#
# Also seeds `respondent.*` (who's answering, not what the business is) and
# `company.has_existing_motion` (explicit, not inferred from team_size — a
# solo founder can have real closed deals). has_existing_motion is what the
# opp_rate Diagnostic Intake Layer gates on (see opp-rate-check.yml), so a
# zero-to-one founder never gets asked for a conversion rate on zero
# meetings.
#
# company_name/product_name/category/pricing_model are seeded via
# url_scrape (company_scrape step) instead of blank text fields — "never
# show a blank field" per the plan's §0.3 exercise pattern. The same step
# also seeds org.brand.primary_color/logo_url from the scrape's page
# metadata (theme-color, og:image/favicon), free on the same API call. A
# skipped or failed scrape leaves the same editable form empty, degrading
# to exactly the old manual-entry behavior with no special-casing needed.
slug: onboarding-diagnostic
schema_version: 3
title: "Your Sales Diagnostic"
module: orientation-diagnostic
tracks: [smb, mid-market, enterprise]
time_estimate: 10m
intent: training

reads: []
requires: []

writes:
  - from: answers.respondent_role
    to: respondent.role
    mode: replace
  - from: answers.respondent_sales_experience
    to: respondent.sales_experience
    mode: replace
  - from: answers.company_scrape.company_name
    to: company.name
    mode: replace
  - from: answers.company_scrape.product_name
    to: company.product_name
    mode: replace
  - from: answers.company_scrape.category
    to: company.category
    mode: replace
  - from: answers.company_scrape.pricing_model
    to: company.pricing_model
    mode: replace
  - from: answers.company_scrape.brand_primary_color
    to: org.brand.primary_color
    mode: replace
  - from: answers.company_scrape.brand_logo_url
    to: org.brand.logo_url
    mode: replace
  - from: answers.motion
    to: company.motion
    mode: replace
  - from: answers.has_existing_motion
    to: company.has_existing_motion
    mode: replace
  - from: answers.acv
    to: company.acv
    mode: replace
  - from: answers.cycle_length
    to: company.cycle_length_days
    mode: replace
  - from: answers.team_size
    to: company.team_size
    mode: replace
  - from: answers.stakeholder_count
    to: company.stakeholder_count
    mode: replace
  - from: answers.target_customer_size
    to: company.target_customer_size
    mode: replace
  - from: answers.procurement_involved
    to: company.procurement_involved
    mode: replace
  - from: answers.buyer_title
    to: company.buyer_title
    mode: replace
  - from: answers.has_sales_manager
    to: team.has_sales_manager
    mode: replace
  - from: answers.total_revenue
    to: company.total_revenue
    mode: replace

steps:
  - type: teach
    body: |
      A few questions about you and how you sell today. Nothing here is
      graded — it just seeds your profile and routes you to the right
      track, so every exercise after this one already knows your business
      instead of asking you to repeat yourself.

  - id: respondent_role
    type: select
    label: "What's your role?"
    options:
      - { value: founder, label: "Founder" }
      - { value: sales_leader, label: "Sales leader / manager" }
      - { value: rep, label: "Individual rep" }
      - { value: other, label: "Other" }

  - id: respondent_sales_experience
    type: select
    label: "How much formal sales experience do you have?"
    options:
      - { value: none, label: "None — this is new to me" }
      - { value: some, label: "Some — I've sold before, informally or early-career" }
      - { value: extensive, label: "Extensive — years of quota-carrying or sales-leadership experience" }

  - id: company_scrape
    type: url_scrape
    label: "Your company website"
    fields:
      - { name: company_name, label: "Company name", type: text }
      - { name: product_name, label: "What you sell, in one sentence", type: textarea }
      - { name: category, label: "Category (e.g. \"B2B sales consulting\", \"POS software\")", type: text }
      - { name: pricing_model, label: "Pricing model (subscription, usage-based, one-time, or hybrid)", type: text }
      - { name: brand_primary_color, label: "Brand primary color (hex)", type: text }
      - { name: brand_logo_url, label: "Logo URL", type: text }

  - id: motion
    type: select
    label: "How do you sell today?"
    options:
      - { value: founder_led, label: "Founder-led — it's mostly me" }
      - { value: team_selling, label: "Team selling — I have reps" }

  - id: has_existing_motion
    type: select
    label: "Have you closed real deals with real customers yet?"
    options:
      - { value: "yes", label: "Yes — we have an existing motion and real numbers to look at" }
      - { value: "no", label: "No — we're just getting started" }

  - id: has_sales_manager
    type: select
    label: "Do you have a dedicated sales manager or team lead (not just reps)?"
    options:
      - { value: "yes", label: "Yes" }
      - { value: "no", label: "No" }

  - id: acv
    type: select
    label: "Typical annual contract value (ACV)"
    options:
      - { value: "3000", label: "Under $5K" }
      - { value: "10000", label: "$5K-$15K" }
      - { value: "20000", label: "$15K-$25K" }
      - { value: "40000", label: "$25K-$50K" }
      - { value: "75000", label: "$50K-$100K" }
      - { value: "150000", label: "$100K+" }

  - id: cycle_length
    type: select
    label: "Typical sales cycle length"
    options:
      # value = representative day count for that band, feeding
      # company.cycle_length_days directly (same pattern as acv above).
      # Chosen so they land in the right bucket against recommend.ts's
      # existing <=30 / <=90 / >90 thresholds without needing a code change.
      - { value: "20", label: "Under 1 month" }
      - { value: "60", label: "1 month to 3 months" }
      - { value: "135", label: "3 to 6 months" }
      - { value: "270", label: "6 months to 1 year" }
      - { value: "400", label: "1 year+" }

  - id: team_size
    type: select
    label: "How many people sell today, including you?"
    options:
      - { value: "1", label: "Just me" }
      - { value: "2", label: "2-4" }
      - { value: "5", label: "5-9" }
      - { value: "10", label: "10+" }

  - id: stakeholder_count
    type: select
    label: "How many people are typically involved in a buying decision?"
    options:
      - { value: "1", label: "Just one" }
      - { value: "2", label: "2-3" }
      - { value: "4", label: "4-5" }
      - { value: "6", label: "6+" }

  - id: target_customer_size
    type: select
    label: "What size companies do you typically sell to?"
    options:
      - { value: micro, label: "Under 20 employees" }
      - { value: small, label: "20-100 employees" }
      - { value: mid_size, label: "100-1,000 employees" }
      - { value: large, label: "1,000+ employees" }

  - id: buyer_title
    type: select
    label: "What's the title of your typical economic buyer (the person who signs off)?"
    options:
      - { value: owner_founder, label: "Owner / Founder" }
      - { value: manager, label: "Manager" }
      - { value: director, label: "Director" }
      - { value: vp, label: "VP" }
      - { value: c_suite, label: "C-suite" }

  - id: procurement_involved
    type: select
    label: "Does procurement, legal, or security review typically get involved in your deals?"
    options:
      - { value: "yes", label: "Yes, regularly" }
      - { value: "no", label: "Rarely or never" }

  - id: total_revenue
    type: select
    label: "What's your company's approximate annual revenue?"
    options:
      - { value: under_1m, label: "Under $1M" }
      - { value: 1m_5m, label: "$1M-$5M" }
      - { value: 5m_20m, label: "$5M-$20M" }
      - { value: 20m_plus, label: "$20M+" }

  - type: output_preview
    shows_writes: true
