# RETIRED — unreachable from the UI, kept on disk only so content:sync's
# stale-row pruning doesn't hard-fail. exercise_sessions.exercise_slug has a
# not-null foreign key to the exercises table with no cascade; historical
# orgs (including production ones) that completed this exercise under the
# old system still have a row referencing this slug, and deleting this file
# would make `npm run content:sync` fail outright on that constraint. The
# orientation-diagnostic module is excluded from Journey's visible-module
# list by slug (see journey/page.tsx) and this exercise is never linked to,
# so no one can start a new session against it. Do not add steps here or
# route anyone to it — every field it used to write now lives on the
# bespoke onboarding screens (src/app/onboarding, not an exercise) instead,
# finishing the migration this file's own comment used to describe as
# in-progress:
#
# motion/acv/cycle_length/stakeholder_count/target_customer_size/
# procurement_involved/buyer_title/has_sales_manager moved to the Customer
# and Sales Motion buckets (src/app/onboarding/actions.ts — saveDealShape,
# saveCustomerProfile, saveHasExistingMotion, saveTeamRoles). The tier
# recommendation this exercise's completion used to trigger as a special
# case (src/app/journey/[slug]/actions.ts) is now computed inside
# saveDealShape instead, the moment its last required input is known.
#
# team_size and total_revenue are simply no longer captured — neither was
# read anywhere outside this file (confirmed by grep before retiring this
# exercise), so there was nothing downstream to migrate them to. Add them
# back on a real onboarding screen if something ever needs them.
#
# respondent.role/sales_experience and company.name/product_name/category/
# pricing_model/has_existing_motion moved to bespoke onboarding screens even
# earlier than this retirement — see git history if that migration's
# reasoning is needed.
slug: onboarding-diagnostic
schema_version: 4
title: "Your Sales Diagnostic"
module: orientation-diagnostic
tracks: [smb, mid-market, enterprise]
time_estimate: 10m
intent: training

reads: []
requires: []

writes:
  - from: answers.motion
    to: company.motion
    mode: replace
  - from: answers.acv
    to: company.acv
    mode: replace
  - from: answers.cycle_length
    to: company.cycle_length_days
    mode: replace
  - from: answers.stakeholder_count
    to: company.stakeholder_count
    mode: replace
  - from: answers.target_customer_size
    to: company.target_customer_size
    mode: replace
  - from: answers.procurement_involved
    to: company.procurement_involved
    mode: replace
  - from: answers.buyer_title
    to: company.buyer_title
    mode: replace
  - from: answers.has_sales_manager
    to: team.has_sales_manager
    mode: replace

steps:
  - type: teach
    body: |
      A few more questions about how you sell today. Nothing here is
      graded — it seeds the rest of your profile and routes you to the
      right track, so every exercise after this one already knows your
      business instead of asking you to repeat yourself.

  - id: motion
    type: select
    label: "How do you sell today?"
    options:
      - { value: founder_led, label: "Founder-led — it's mostly me" }
      - { value: team_selling, label: "Team selling — I have reps" }

  - id: has_sales_manager
    type: select
    label: "Do you have a dedicated sales manager or team lead (not just reps)?"
    options:
      - { value: "yes", label: "Yes" }
      - { value: "no", label: "No" }

  - id: acv
    type: select
    label: "Typical annual contract value (ACV)"
    options:
      - { value: "3000", label: "Under $5K" }
      - { value: "10000", label: "$5K-$15K" }
      - { value: "20000", label: "$15K-$25K" }
      - { value: "40000", label: "$25K-$50K" }
      - { value: "75000", label: "$50K-$100K" }
      - { value: "150000", label: "$100K+" }

  - id: cycle_length
    type: select
    label: "Typical sales cycle length"
    options:
      # value = representative day count for that band, feeding
      # company.cycle_length_days directly (same pattern as acv above).
      # Chosen so they land in the right bucket against recommend.ts's
      # existing <=30 / <=90 / >90 thresholds without needing a code change.
      - { value: "20", label: "Under 1 month" }
      - { value: "60", label: "1 month to 3 months" }
      - { value: "135", label: "3 to 6 months" }
      - { value: "270", label: "6 months to 1 year" }
      - { value: "400", label: "1 year+" }

  - id: stakeholder_count
    type: select
    label: "How many people are typically involved in a buying decision?"
    options:
      - { value: "1", label: "Just one" }
      - { value: "2", label: "2-3" }
      - { value: "4", label: "4-5" }
      - { value: "6", label: "6+" }

  - id: target_customer_size
    type: select
    label: "What size companies do you typically sell to?"
    options:
      - { value: micro, label: "Under 20 employees" }
      - { value: small, label: "20-100 employees" }
      - { value: mid_size, label: "100-1,000 employees" }
      - { value: large, label: "1,000+ employees" }

  - id: buyer_title
    type: select
    label: "What's the title of your typical economic buyer (the person who signs off)?"
    options:
      - { value: owner_founder, label: "Owner / Founder" }
      - { value: manager, label: "Manager" }
      - { value: director, label: "Director" }
      - { value: vp, label: "VP" }
      - { value: c_suite, label: "C-suite" }

  - id: procurement_involved
    type: select
    label: "Does procurement, legal, or security review typically get involved in your deals?"
    options:
      - { value: "yes", label: "Yes, regularly" }
      - { value: "no", label: "Rarely or never" }

  - type: output_preview
    shows_writes: true
